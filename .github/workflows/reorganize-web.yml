name: Organizar aplicação web

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalizar reorganização
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reorganize-web.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove workflow temporário de reorganização"
          git push origin HEAD:main
