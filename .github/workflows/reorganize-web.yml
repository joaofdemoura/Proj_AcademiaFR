name: Organizar aplicação web

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Mover a aplicação para web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web
          while IFS= read -r item; do
            case "$item" in
              .gitignore|banco|.github|web) ;;
              *) git mv "$item" web/ ;;
            esac
          done < <(git ls-tree --name-only HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "organiza aplicação web na pasta web"
          git push origin HEAD:main
