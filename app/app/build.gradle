plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.app_academiafr'
    compileSdk 37

    defaultConfig {
        applicationId 'com.example.app_academiafr'
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Credenciais de teste são opcionais e chegam apenas do ambiente local.
        ['EMAIL':'e2eEmail', 'PASSWORD':'e2ePasswordBase64', 'TITLE':'e2eTitleBase64', 'COUNT':'e2eCount', 'SETS':'e2eSets'].each { key, argument ->
            def value = System.getenv("ACADEMIA_E2E_${key}")
            if (value) testInstrumentationRunnerArguments[argument] = key in ['PASSWORD', 'TITLE'] ? value.getBytes('UTF-8').encodeBase64().toString() : value
        }


        // Endereço da API Laravel. No emulador, 10.0.2.2 é o próprio computador;
        // porta 8000 corresponde a php artisan serve.
        // Para outro endereço, defina apiBaseUrl/apiHost no gradle.properties.
        buildConfigField 'String', 'API_BASE_URL', "\"${project.findProperty('apiBaseUrl') ?: 'http://10.0.2.2:8000/api/'}\""
        buildConfigField 'String', 'API_HOST', "\"${project.hasProperty('apiHost') ? project.property('apiHost') : ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            optimization {
                enable = true
                packageScope = ['androidx.**'] as Set
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.androidx.activity
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core
    implementation libs.material
    implementation libs.retrofit
    implementation libs.retrofit.gson
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
}
